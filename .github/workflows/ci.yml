name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: colab
          POSTGRES_USER: colab
          POSTGRES_PASSWORD: colab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U colab -d colab"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://colab:colab@localhost:5432/colab
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t colab:${{ github.sha }} .
