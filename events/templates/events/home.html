{% extends "base.html" %}
{% block content %}
  <h1>What's happening at CoLab</h1>
  {% if events %}
    <ul class="event-list">
      {% for event in events %}
        <li>
          <a href="{% url 'event_detail' event.pk %}">{{ event.title }}</a>
          <p class="meta">{{ event.when }} · {{ event.space }}</p>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No upcoming events yet. Check back soon.</p>
  {% endif %}
{% endblock %}
