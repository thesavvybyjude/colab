{% extends "base.html" %}
{% block content %}
  <h1>What's happening at CoLab</h1>
  {% if events %}
    <ul class="event-list">
      {% for event in events %}
        <li>
          <a class="event-row" href="{% url 'event_detail' event.pk %}">
            <span class="event-title">{{ event.title }}</span>
            <span class="meta">{{ event.when }} · {{ event.space }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No upcoming events yet. Check back soon.</p>
  {% endif %}
{% endblock %}
