[project]
name = "colab"
version = "0.1.0"
description = "CoLab Jos events and publicity system"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "dj-database-url>=2",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = ["pytest", "pytest-django", "pytest-env", "ruff"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-q"
# Tests run in debug mode with the dev secret unless the environment already sets them.
env = ["D:DJANGO_DEBUG=true"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
