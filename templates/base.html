{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CoLab{% endblock %}</title>
  <link rel="icon" href="{% static 'favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'colab.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'home' %}">CoLab</a>
    <nav>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="link">Sign out</button></form>
      {% else %}
        <a href="{% url 'login' %}">Staff sign-in</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
