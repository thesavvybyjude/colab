{% extends "base.html" %}
{% block title %}Sign in · CoLab{% endblock %}
{% block content %}
  <h1>Staff sign-in</h1>
  {% if form.errors %}<p class="error">That username and password don't match.</p>{% endif %}
  <form method="post" class="stack">
    {% csrf_token %}
    <label>Username {{ form.username }}</label>
    <label>Password {{ form.password }}</label>
    <button type="submit">Sign in</button>
  </form>
{% endblock %}
